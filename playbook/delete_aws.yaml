
---
- name: Lab 2 - Delete AWS EC2 Instances
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/instances.yaml

  tasks:
    - name: Validate target
      ansible.builtin.assert:
        that:
          - target_name | default('all') == 'all' or target_name in (ec2_instances | map(attribute='name') | list)

    - name: Find Lab 2 Instances
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        filters:
          "tag:Project": IaC_Lab
          "tag:Lab": lab2
          "instance-state-name":
            - running
            - stopped
            - pending
            - stopping
      register: ec2_info

    - name: Show EC2 to delete
      ansible.builtin.debug:
        msg: "{{ item.tags.Name }} => {{ item.instance_id }}"
      loop: "{{ ec2_info.instances }}"
      when:
        - item.tags.Name | default('') in (ec2_instances | map(attribute='name') | list)
        - target_name | default('all') == 'all' or item.tags.Name | default('') == target_name

    - name: Confirm deletion
      ansible.builtin.pause:
        prompt: "Type DELETE to terminate selected Lab 2 EC2"
      register: confirmation
      when: not ansible_check_mode

    - name: Delete selected EC2
      amazon.aws.ec2_instance:
        region: "{{ aws_region }}"
        instance_ids:
          - "{{ item.instance_id }}"
        state: terminated
        wait: true
      loop: "{{ ec2_info.instances }}"
      loop_control:
        label: "{{ item.tags.Name | default(item.instance_id) }}"
      when:
        - item.tags.Name | default('') in (ec2_instances | map(attribute='name') | list)
        - target_name | default('all') == 'all' or item.tags.Name | default('') == target_name
        - not ansible_check_mode
        - confirmation.user_input == 'DELETE'
